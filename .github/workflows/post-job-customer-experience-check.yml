name: Post-job customer experience checks

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  post-job:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check post-job customer experience
        run: |
          node --check account-post-job.js
          node --check api/customer-post-job.js
          node --check api/customer-jobs.js
          node --test scripts/post-job-customer-experience.test.mjs
