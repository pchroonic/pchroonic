name: Stripe live readiness checks

on:
  pull_request:
    paths:
      - 'lib/payment-policy.js'
      - 'api/admin-payment-settings.js'
      - 'admin-payment-settings.js'
      - 'admin.js'
      - 'scripts/stripe-live-readiness.test.mjs'
      - 'scripts/payment-policy-engine.test.mjs'
      - 'scripts/stripe-payments.test.mjs'
      - '.github/workflows/stripe-live-readiness-check.yml'
  push:
    branches: [main]
    paths:
      - 'lib/payment-policy.js'
      - 'api/admin-payment-settings.js'
      - 'admin-payment-settings.js'
      - 'admin.js'
      - 'scripts/stripe-live-readiness.test.mjs'
      - 'scripts/payment-policy-engine.test.mjs'
      - 'scripts/stripe-payments.test.mjs'
      - '.github/workflows/stripe-live-readiness-check.yml'

jobs:
  stripe-readiness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test scripts/stripe-live-readiness.test.mjs scripts/payment-policy-engine.test.mjs scripts/stripe-payments.test.mjs
